<html lang="en">
  <head>
    <script>
      (() => {
        let theme = 'dark';
        try { if (localStorage.getItem('theme-preference') === 'light') theme = 'light'; } catch {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
